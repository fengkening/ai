name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构（both = arm64 + amd64）"
        type: choice
        options:
          - both
          - arm64
          - amd64
        default: both

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      arch: ${{ steps.set.outputs.arch }}
    steps:
      - id: set
        name: 计算目标架构
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARCH="${{ inputs.arch }}"
          else
            ARCH="both"
          fi
          case "$ARCH" in
            both)  MATRIX='["arm64","amd64"]' ;;
            arm64) MATRIX='["arm64"]' ;;
            amd64) MATRIX='["amd64"]' ;;
            *) echo "未知架构: $ARCH"; exit 1 ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "目标架构: $ARCH → $MATRIX"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/hello-linux-${GOARCH}" .

      - uses: actions/upload-artifact@v4
        with:
          name: hello-linux-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
